[project]
name = "klt"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Iyed GHEDAMSI", email = "iyed.ghedamsi@impact-initiatives.org" }
]
requires-python = ">=3.12"
dependencies = [
    "azure-identity>=1.25.1",
    "azure-keyvault-secrets>=4.9.0",
    "dlt[duckdb,postgres,workspace]>=1.17.1",
    "loguru>=0.7.3",
    "orjson>=3.11.4",
    "pandas>=2.3.3",
    "pendulum>=3.1.0",
    "pydantic-settings>=2.12.0",
    "pydantic[email]>=2.12.4",
    "requests-cache>=1.2.1",
    "rich>=14.2.0",
    "sentry-sdk>=2.47.0",
    "typer>=0.19.2",
]

[project.scripts]
klt = "klt:cli.app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ipdb>=0.13.13",
    "pytest>=8.4.2",
    "pytest-sugar>=1.1.1",
    "pytest-watcher>=0.4.3",
    "pytest-randomly>=4.0.1",
    "pytest-xdist",
    "pytest-deadfixtures>=2.2.1",
    "pytest-mock>=3.15.1",
    "ipython>=9.6.0",
    "responses>=0.25.8",
    "mock>=5.2.0",
]

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
]
mock_use_standalone_module = true
filterwarnings = [
    "ignore:This process \\(pid=\\d+\\) is multi-threaded, use of fork\\(\\) may lead to deadlocks in the child\\.:DeprecationWarning",
]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = [
    "F",    # Pyflakes — undefined names, unused imports
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "I",    # isort
    "UP",   # pyupgrade — modernise syntax
    "B",    # bugbear — subtle bugs (mutable defaults, lost tracebacks)
    "T20",  # no print(), use logging
    "G",    # logging format — lazy % args over f-strings
    "RUF",  # Ruff-native rules
    "ANN",  # type annotation coverage for public functions
    "TCH",  # move type-only imports to TYPE_CHECKING
    "DTZ",  # enforce timezone-aware datetimes
    "PTH",  # prefer pathlib over os.path
    "SIM",  # simplify control flow
    "N",    # pep8 naming conventions
    "C90",  # mccabe complexity
    "RET",  # return statement consistency
]

ignore = [
    "ANN401",  # Allow Any — dlt types rely on it
    "PLR0913", # Allow many args — dlt resources need them
    "G004",    # Allow f-strings in log calls — more readable
    "B008",    # typer.Option in defaults is intentional typer pattern
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]          # re-exports are intentional
"tests/**/*.py" = ["PLR2004"]     # magic values fine in assertions
"src/klt/models/*.py" = ["TC001", "TC002"]  # pydantic resolves annotations at runtime via model_rebuild()

[tool.ruff.lint.isort]
known-first-party = ["klt"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
