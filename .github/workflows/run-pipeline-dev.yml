name: Run KLT Pipeline (Dev)
run-name: Run incremental pipeline on Azure Container Instance

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker image tag (NOT branch name - use "dev" or "test" or custom tag from docker-test workflow)'
        required: false
        type: string
        default: 'dev'
      submission_time_start:
        description: 'Submission time start (YYYY-MM-DD or ISO 8601)'
        required: false
        type: string
      asset_last_submission_start:
        description: 'Asset last submission start (YYYY-MM-DD or ISO 8601)'
        required: false
        type: string
      asset_modified_start:
        description: 'Asset modified start (YYYY-MM-DD or ISO 8601)'
        required: false
        type: string
      excluded_asset_uids:
        description: 'Comma-separated asset UIDs to exclude from discovery (e.g. assets triggering 429/5xx errors). Mutually exclusive with included_asset_uids. Overrides asset_filters.toml for this run.'
        required: false
        type: string
      included_asset_uids:
        description: 'Comma-separated asset UIDs to restrict discovery to. Mutually exclusive with excluded_asset_uids. Overrides asset_filters.toml for this run.'
        required: false
        type: string
      pipeline_name:
        description: 'Pipeline name'
        required: false
        type: string
        default: 'klt-dev'
      dataset_name:
        description: 'Dataset name'
        required: false
        type: string
        default: 'kobo_dev'
      write_disposition:
        description: 'Write disposition'
        required: false
        type: choice
        options:
          - merge
          - replace
          - append
        default: 'merge'
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'

env:
  AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
  AZURE_LOCATION: ${{ vars.AZURE_LOCATION || 'switzerlandnorth' }}
  PIPELINE_NAME: ${{ inputs.pipeline_name || 'klt-dev' }}
  CONTAINER_NAME: ${{ github.run_id }}-${{ inputs.pipeline_name || 'klt-dev' }}
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/klt:${{ inputs.image_tag || 'dev' }}

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Azure Login
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set environment variables
        id: set-env
        run: |
          # Set required environment variables for dlt and secrets
          echo "KLT_DESTINATION=${{ vars.KLT_DESTINATION || 'postgres' }}" >> $GITHUB_ENV
          echo "KLT_PROGRESS=${{ vars.KLT_PROGRESS || 'log' }}" >> $GITHUB_ENV
          echo "DLT_DATA_DIR=/app/klt_pipelines" >> $GITHUB_ENV
          echo "KLT_LOG_DIR=/app/klt_pipelines/logs/${{ env.PIPELINE_NAME }}/${{ github.run_id }}" >> $GITHUB_ENV

      - name: Create Azure Container Instance
        run: |
          # Build CLI command with explicit arguments
          CMD="klt run incremental"
          CMD="$CMD --pipeline-name '${{ inputs.pipeline_name || 'klt-dev' }}'"
          CMD="$CMD --destination '${{ vars.KLT_DESTINATION || 'postgres' }}'"
          CMD="$CMD --dataset-name '${{ inputs.dataset_name || 'kobo_dev' }}'"
          CMD="$CMD --write-disposition '${{ inputs.write_disposition || 'merge' }}'"
          CMD="$CMD --progress '${{ vars.KLT_PROGRESS || 'log' }}'"

          # Add optional datetime parameters if provided
          if [ -n "${{ inputs.submission_time_start }}" ]; then
            CMD="$CMD --submission-time-start '${{ inputs.submission_time_start }}'"
          fi
          if [ -n "${{ inputs.asset_last_submission_start }}" ]; then
            CMD="$CMD --asset-last-submission-start '${{ inputs.asset_last_submission_start }}'"
          fi
          if [ -n "${{ inputs.asset_modified_start }}" ]; then
            CMD="$CMD --asset-modified-start '${{ inputs.asset_modified_start }}'"
          fi
          if [ -n "${{ inputs.excluded_asset_uids }}" ]; then
            IFS=',' read -ra EXCLUDED_UIDS <<< "${{ inputs.excluded_asset_uids }}"
            for uid in "${EXCLUDED_UIDS[@]}"; do
              CMD="$CMD --excluded-asset-uid '$(echo "$uid" | xargs)'"
            done
          fi
          if [ -n "${{ inputs.included_asset_uids }}" ]; then
            IFS=',' read -ra INCLUDED_UIDS <<< "${{ inputs.included_asset_uids }}"
            for uid in "${INCLUDED_UIDS[@]}"; do
              CMD="$CMD --included-asset-uid '$(echo "$uid" | xargs)'"
            done
          fi

          az container create \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --name ${{ env.CONTAINER_NAME }} \
            --image ${{ env.IMAGE_NAME }} \
            --os-type Linux \
            --cpu ${{ vars.AZURE_CONTAINER_CPU || '4' }} \
            --memory ${{ vars.AZURE_CONTAINER_MEMORY || '16' }} \
            --restart-policy Never \
            --location ${{ env.AZURE_LOCATION }} \
            --azure-file-volume-account-name ${{ secrets.AZURE_STORAGE_ACCOUNT }} \
            --azure-file-volume-account-key ${{ secrets.AZURE_STORAGE_KEY }} \
            --azure-file-volume-share-name ${{ secrets.AZURE_FILE_SHARE }} \
            --azure-file-volume-mount-path /app/klt_pipelines \
            --environment-variables \
              DLT_DATA_DIR=/app/klt_pipelines \
              KLT_LOG_DIR=/app/klt_pipelines/logs/${{ env.PIPELINE_NAME }}/${{ github.run_id }} \
              DESTINATION__POSTGRES__CREDENTIALS__PORT=${{ secrets.POSTGRES_PORT || '5432' }} \
              DESTINATION__POSTGRES__CREDENTIALS__CONNECT_TIMEOUT=${{ vars.POSTGRES_CONNECT_TIMEOUT || '15' }} \
            --secure-environment-variables \
              SOURCES__KOBO_SERVER="${{ secrets.KOBO_SERVER }}" \
              SOURCES__KOBO_TOKEN="${{ secrets.KOBO_TOKEN }}" \
              SOURCES__KOBO_PROJECT_VIEW="${{ secrets.KOBO_PROJECT_VIEW }}" \
              DESTINATION__POSTGRES__CREDENTIALS__DATABASE="${{ secrets.POSTGRES_DATABASE }}" \
              DESTINATION__POSTGRES__CREDENTIALS__USERNAME="${{ secrets.POSTGRES_USERNAME }}" \
              DESTINATION__POSTGRES__CREDENTIALS__PASSWORD="${{ secrets.POSTGRES_PASSWORD }}" \
              DESTINATION__POSTGRES__CREDENTIALS__HOST="${{ secrets.POSTGRES_HOST }}" \
            --command-line "$CMD"

      - name: Follow container logs
        run: |
          echo "📋 Following container logs..."

          # Wait for container to start
          echo "Waiting for container to start..."
          for i in {1..30}; do
            STATE=$(az container show \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --name ${{ env.CONTAINER_NAME }} \
              --query "instanceView.state" -o tsv 2>/dev/null || echo "Pending")

            echo "Container state: $STATE"

            if [ "$STATE" = "Running" ] || [ "$STATE" = "Succeeded" ] || [ "$STATE" = "Failed" ] || [ "$STATE" = "Terminated" ]; then
              break
            fi

            sleep 2
          done

          # Follow logs in background and poll for completion
          az container logs \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --name ${{ env.CONTAINER_NAME }} \
            --follow &

          LOG_PID=$!

          # Poll container state
          while true; do
            STATE=$(az container show \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --name ${{ env.CONTAINER_NAME }} \
              --query "instanceView.state" -o tsv 2>/dev/null || echo "Unknown")

            if [ "$STATE" = "Succeeded" ] || [ "$STATE" = "Failed" ] || [ "$STATE" = "Terminated" ]; then
              echo ""
              echo "Container finished with state: $STATE"
              # Kill the log follow process
              kill $LOG_PID 2>/dev/null || true
              # Wait a moment for final logs to be available
              sleep 2
              break
            fi

            sleep 10
          done

      - name: Check container exit code
        if: always()
        run: |
          EXIT_CODE=$(az container show \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --name ${{ env.CONTAINER_NAME }} \
            --query "containers[0].instanceView.currentState.exitCode" -o tsv)

          echo "Container exit code: $EXIT_CODE"

          if [ "$EXIT_CODE" != "0" ]; then
            echo "❌ Pipeline failed with exit code $EXIT_CODE"
            exit 1
          fi
          echo "✅ Pipeline completed successfully"

      - name: Trigger Matryoshka dbt run
        if: success()
        env:
          MATRYOSHKA_TOKEN: ${{ secrets.MATRYOSHKA_WORKFLOW_TOKEN }}
        run: |
          curl -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $MATRYOSHKA_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/impact-initiatives/matryoshka/actions/workflows/run-dbt-aci.yml/dispatches \
            -d '{"ref":"main"}'

      - name: Delete container
        if: always()
        run: |
          az container delete \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --name ${{ env.CONTAINER_NAME }} \
            --yes
