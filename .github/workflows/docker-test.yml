name: Docker Test (Hub)
run-name: Build & push test image from ${{ inputs.branch || github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build from (defaults to current branch)'
        required: false
        type: string
      tag_suffix:
        description: 'Custom tag suffix (e.g., "perf-test")'
        required: false
        type: string
        default: 'test'

env:
  IMAGE_NAME: klt

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ inputs.tag_suffix || 'test' }}
            type=raw,value=${{ inputs.tag_suffix || 'test' }}-{{date 'YYYYMMDD-HHmmss'}}
            type=raw,value=${{ inputs.tag_suffix || 'test' }}-${{ github.ref_name }}
            type=sha,prefix=${{ inputs.tag_suffix || 'test' }}-

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Output image tags
        run: |
          BRANCH="${{ inputs.branch || github.ref_name }}"
          TAG="${{ inputs.tag_suffix || 'test' }}"

          echo "## 🐳 Built and pushed test image" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`$BRANCH\`" >> $GITHUB_STEP_SUMMARY
          echo "**Primary Tag:** \`${{ secrets.DOCKERHUB_USERNAME }}/klt:$TAG\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**All Tags:**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Next Steps:**" >> $GITHUB_STEP_SUMMARY
          echo "1. Go to Actions → Run KLT Pipeline (Batch) or Run KLT Pipeline (Dev)" >> $GITHUB_STEP_SUMMARY
          echo "2. Set \`image_tag\` input to: \`$TAG\`" >> $GITHUB_STEP_SUMMARY
          echo "3. Trigger workflow to run pipeline with this image" >> $GITHUB_STEP_SUMMARY
